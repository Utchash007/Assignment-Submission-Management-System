version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: onnorokom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onnorokom_asm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-onnorokom_asm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - onnorokom-net

  # ----------------------------------------------------
  # 2. Spring Boot Backend Web API
  # NOTE: the backend runs ddl-auto=validate, so a FRESH postgres needs the
  # schema created once first (apply Backend EF migration SQL or point at an
  # existing database). On first boot with empty tables, DataSeeder inserts
  # the demo accounts and sample data automatically.
  # ----------------------------------------------------
  backend:
    build:
      context: ./Java-Backend/spring-asms
      dockerfile: Dockerfile
    container_name: onnorokom-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL must be provided in .env}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-OnnoRokomBackend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-OnnoRokomFrontend}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be provided in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx384m}
      PORT: 5000
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - onnorokom-net

  # ----------------------------------------------------
  # 3. Next.js 15 Frontend Web App
  # ----------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: onnorokom-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      INTERNAL_BACKEND_URL: ${INTERNAL_BACKEND_URL:-http://backend:5000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - onnorokom-net

networks:
  onnorokom-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
